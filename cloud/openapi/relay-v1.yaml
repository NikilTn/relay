components:
  schemas:
    DirectoryEntry:
      properties:
        shelter_id:
          type: string
          title: Shelter Id
        incident_id:
          type: string
          title: Incident Id
        display_name:
          type: string
          title: Display Name
      additionalProperties: false
      type: object
      required:
      - shelter_id
      - incident_id
      - display_name
      title: DirectoryEntry
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        retryable:
          type: boolean
          title: Retryable
          default: false
      additionalProperties: false
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      additionalProperties: false
      type: object
      required:
      - error
      title: ErrorResponse
      examples:
      - error:
          code: idempotency_conflict
          message: An identifier was already used with different immutable content
          retryable: false
    Health:
      properties:
        status:
          type: string
          const: ok
          title: Status
        api_version:
          type: string
          title: Api Version
        schema_version:
          type: integer
          const: 1
          title: Schema Version
        mode:
